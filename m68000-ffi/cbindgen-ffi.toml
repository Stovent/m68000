language = "C"
include_guard = "M68000_M68000_FFI_H"

include_version = false
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
includes = []
no_includes = true
cpp_compat = false

braces = "NextLine"
line_length = 120
tab_width = 4
documentation = true
documentation_style = "auto"
line_endings = "CRLF" # also "CR", "CRLF", "Native"
style = "both"

usize_is_size_t = true

[export]
include = ["Registers", "StatusRegister", "Vector"]
exclude = ["AddressingMode", "BriefExtensionWord", "Direction", "Instruction", "Operands", "Size", "WrappingU32"]

[export.rename]
"Registers" = "m68000_registers_t"
"StatusRegister" = "m68000_status_register_t"
"Vector" = "m68000_vector_t"
"WrappingU32" = "uint32_t"

[fn]
args = "horizontal"
sort_by = "None"

[const]
allow_constexpr = true

[parse]
parse_deps = true
include = ["m68000"]

[parse.expand]
crates = ["m68000", "m68000-ffi"]
default_features = false
features = ["m68000/ffi"]
